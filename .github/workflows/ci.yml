name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      run_mutant_changes:
        description: Run Mutant Changes after every other CI job succeeds
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      active_job: ${{ steps.filter.outputs.active_job }}
      core: ${{ steps.filter.outputs.core }}
      gcp: ${{ steps.filter.outputs.gcp }}
      karafka: ${{ steps.filter.outputs.karafka }}
      rack: ${{ steps.filter.outputs.rack }}
      ractor: ${{ steps.filter.outputs.ractor }}
      rails: ${{ steps.filter.outputs.rails }}
      rails_support: ${{ steps.filter.outputs.rails_support }}
      release_metadata: ${{ steps.filter.outputs.release_metadata }}
      redaction: ${{ steps.filter.outputs.redaction }}
      semantic_logger: ${{ steps.filter.outputs.semantic_logger }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - '.github/dependabot.yml'
              - '.github/workflows/**'
              - '.gitignore'
              - '.rubocop.yml'
              - 'Rakefile'
              - 'codecov.yml'
              - 'support/**'
            release_metadata:
              - 'Rakefile'
              - 'gems/*/*.gemspec'
              - 'gems/*/CHANGELOG.md'
              - 'gems/*/lib/julewire/**/version.rb'
            core:
              - 'gems/core/**'
            active_job:
              - 'gems/active_job/**'
            gcp:
              - 'gems/gcp/**'
            karafka:
              - 'gems/karafka/**'
            rack:
              - 'gems/rack/**'
            ractor:
              - 'gems/ractor/**'
            rails:
              - 'gems/rails/**'
            rails_support:
              - 'gems/rails_support/**'
            redaction:
              - 'gems/redaction/**'
            semantic_logger:
              - 'gems/semantic_logger/**'

  release-check:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.release_metadata == 'true' }}
    runs-on: ubuntu-latest
    name: release metadata
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Check release metadata
        run: ruby -S rake release:check

  mutant-targets:
    runs-on: ubuntu-latest
    name: mutant targets
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Check generated mutant targets
        run: ruby -S rake mutant:targets:check

  mutant-runtime-targets:
    runs-on: ubuntu-latest
    name: mutant runtime targets / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dir: gems/core
          - name: active_job
            dir: gems/active_job
          - name: rails
            dir: gems/rails
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: ${{ matrix.dir }}

      - name: Check loaded Mutant subjects
        env:
          BUNDLE_GEMFILE: ${{ matrix.dir }}/Gemfile
          GEM_DIR: ${{ matrix.dir }}
        run: bundle exec ruby -S rake mutant:targets:runtime

  repository-policy:
    runs-on: ubuntu-latest
    name: repository policy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: gems/core

      - name: Check boundaries, API tags, and production duplication
        env:
          BUNDLE_GEMFILE: gems/core/Gemfile
        run: bundle exec ruby -S rake all:boundaries all:api_tags all:flay

  core:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    name: core / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/core

      - name: Run the default task
        working-directory: gems/core
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/core/coverage/lcov/lcov.info
          disable_search: true
          flags: core
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/core/test/reports/TEST-minitest.xml
          disable_search: true
          flags: core,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  active_job:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.active_job == 'true' || needs.changes.outputs.rails_support == 'true' }}
    runs-on: ubuntu-latest
    name: active_job / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/active_job

      - name: Run the default task
        working-directory: gems/active_job
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/active_job/coverage/lcov/lcov.info
          disable_search: true
          flags: active_job
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/active_job/test/reports/TEST-minitest.xml
          disable_search: true
          flags: active_job,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  active-job-solid-queue:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.active_job == 'true' || needs.changes.outputs.rails_support == 'true' }}
    runs-on: ubuntu-latest
    name: active_job / Solid Queue / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/active_job/gemfiles/solid_queue.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/active_job

      - name: Run Solid Queue batch integration tests
        working-directory: gems/active_job
        env:
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: integration/test/reports
        run: bundle exec rake integration:solid_queue

      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/active_job/integration/test/reports/TEST-minitest.xml
          disable_search: true
          flags: active_job_solid_queue,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  gcp:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.gcp == 'true' }}
    runs-on: ubuntu-latest
    name: gcp / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/gcp

      - name: Run the default task
        working-directory: gems/gcp
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/gcp/coverage/lcov/lcov.info
          disable_search: true
          flags: gcp
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/gcp/test/reports/TEST-minitest.xml
          disable_search: true
          flags: gcp,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  karafka:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.karafka == 'true' }}
    runs-on: ubuntu-latest
    name: karafka / Ruby ${{ matrix.ruby }}
    strategy:
