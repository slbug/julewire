          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/karafka

      - name: Run the default task
        working-directory: gems/karafka
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/karafka/coverage/lcov/lcov.info
          disable_search: true
          flags: karafka
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/karafka/test/reports/TEST-minitest.xml
          disable_search: true
          flags: karafka,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  rails:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.rack == 'true' || needs.changes.outputs.rails == 'true' || needs.changes.outputs.rails_support == 'true' }}
    runs-on: ubuntu-latest
    name: rails / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
