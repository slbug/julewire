          bundler-cache: true
          working-directory: gems/rails

      - name: Run the default task
        working-directory: gems/rails
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/rails/coverage/lcov/lcov.info
          disable_search: true
          flags: rails
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/rails/test/reports/TEST-minitest.xml
          disable_search: true
          flags: rails,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  rack:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.rack == 'true' }}
    runs-on: ubuntu-latest
    name: rack / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/rack

      - name: Run the default task
        working-directory: gems/rack
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/rack/coverage/lcov/lcov.info
          disable_search: true
          flags: rack
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/rack/test/reports/TEST-minitest.xml
          disable_search: true
          flags: rack,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  rails-appraisal:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.rack == 'true' || needs.changes.outputs.rails == 'true' || needs.changes.outputs.rails_support == 'true' }}
    runs-on: ubuntu-latest
    name: rails appraisal / Ruby 4.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: gems/rails

      - name: Run Rails 8.1 and Rails head suites
        working-directory: gems/rails
        env:
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake appraisal:test

      - name: Upload appraisal test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/rails/test/reports/rails_8_1/TEST-minitest.xml,./gems/rails/test/reports/rails_head/TEST-minitest.xml
          disable_search: true
          flags: rails_appraisal,ruby-4.0
          fail_ci_if_error: true

  rails_support:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.rails_support == 'true' }}
    runs-on: ubuntu-latest
    name: rails_support / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/rails_support

      - name: Run the default task
        working-directory: gems/rails_support
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/rails_support/coverage/lcov/lcov.info
          disable_search: true
          flags: rails_support
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/rails_support/test/reports/TEST-minitest.xml
          disable_search: true
          flags: rails_support,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  redaction:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.redaction == 'true' }}
    runs-on: ubuntu-latest
    name: redaction / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/redaction

      - name: Run the default task
        working-directory: gems/redaction
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/redaction/coverage/lcov/lcov.info
          disable_search: true
          flags: redaction
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/redaction/test/reports/TEST-minitest.xml
          disable_search: true
          flags: redaction,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  semantic_logger:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.semantic_logger == 'true' }}
    runs-on: ubuntu-latest
    name: semantic_logger / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/semantic_logger

      - name: Run the default task
        working-directory: gems/semantic_logger
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/semantic_logger/coverage/lcov/lcov.info
          disable_search: true
          flags: semantic_logger
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/semantic_logger/test/reports/TEST-minitest.xml
          disable_search: true
          flags: semantic_logger,ruby-${{ matrix.ruby }}
          fail_ci_if_error: true

  semantic-logger-appraisal:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.semantic_logger == 'true' }}
    runs-on: ubuntu-latest
    name: semantic_logger appraisal / Ruby 4.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: gems/semantic_logger

      - name: Run Semantic Logger 4 and 5 suites
        working-directory: gems/semantic_logger
        env:
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake appraisal:test

      - name: Upload appraisal test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/semantic_logger/test/reports/semantic_logger_4/TEST-minitest.xml,./gems/semantic_logger/test/reports/semantic_logger_5/TEST-minitest.xml
          disable_search: true
          flags: semantic_logger_appraisal,ruby-4.0
          fail_ci_if_error: true

  ractor:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ractor == 'true' }}
    runs-on: ubuntu-latest
    name: ractor / Ruby 4.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: gems/ractor

      - name: Run the default task
        working-directory: gems/ractor
        env:
          COVERAGE: "true"
          JULEWIRE_JUNIT: "1"
          JULEWIRE_JUNIT_DIR: test/reports
        run: bundle exec rake

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./gems/ractor/coverage/lcov/lcov.info
          disable_search: true
          flags: ractor
          fail_ci_if_error: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: ./gems/ractor/test/reports/TEST-minitest.xml
          disable_search: true
          flags: ractor,ruby-4.0
          fail_ci_if_error: true

  mutant:
    needs:
      - changes
      - release-check
      - mutant-targets
      - mutant-runtime-targets
      - repository-policy
      - core
      - active_job
      - active-job-solid-queue
      - gcp
      - karafka
      - rails
      - rack
      - rails-appraisal
      - rails_support
      - redaction
      - semantic_logger
      - semantic-logger-appraisal
      - ractor
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.run_mutant_changes == true &&
        !contains(needs.*.result, 'failure') &&
        !contains(needs.*.result, 'cancelled') &&
        (
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.core == 'true' ||
          needs.changes.outputs.active_job == 'true' ||
          needs.changes.outputs.gcp == 'true' ||
          needs.changes.outputs.karafka == 'true' ||
          needs.changes.outputs.rack == 'true' ||
          needs.changes.outputs.ractor == 'true' ||
          needs.changes.outputs.rails == 'true' ||
          needs.changes.outputs.rails_support == 'true' ||
          needs.changes.outputs.redaction == 'true' ||
          needs.changes.outputs.semantic_logger == 'true'
        )
      }}
    runs-on: ubuntu-latest
    name: mutant changes (manual) / Ruby 4.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Run configured mutation subjects
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SINCE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "$SINCE_SHA" ]]; then
            SINCE_SHA="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          if [[ "$SINCE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${SINCE_SHA}^{commit}" 2>/dev/null; then
            SINCE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          export SINCE_SHA

          run_mutant() {
            local dir="$1"
            local task="$2"

            (cd "$dir" && bundle install)
            ruby -S rake "mutant:${task}:changes"
          }

          if [[ "${{ needs.changes.outputs.shared }}" == "true" || "${{ needs.changes.outputs.core }}" == "true" ]]; then
            run_mutant gems/active_job active_job
            run_mutant gems/core core
            run_mutant gems/gcp gcp
            run_mutant gems/karafka karafka
            run_mutant gems/rack rack
            run_mutant gems/ractor ractor
            run_mutant gems/rails rails
            run_mutant gems/rails_support rails_support
            run_mutant gems/redaction redaction
            run_mutant gems/semantic_logger semantic_logger
            exit 0
          fi

          if [[ "${{ needs.changes.outputs.active_job }}" == "true" || "${{ needs.changes.outputs.rails_support }}" == "true" ]]; then
            run_mutant gems/active_job active_job
          fi

          if [[ "${{ needs.changes.outputs.gcp }}" == "true" ]]; then
            run_mutant gems/gcp gcp
          fi

          if [[ "${{ needs.changes.outputs.karafka }}" == "true" ]]; then
            run_mutant gems/karafka karafka
          fi

          if [[ "${{ needs.changes.outputs.rack }}" == "true" ]]; then
            run_mutant gems/rack rack
          fi

          if [[ "${{ needs.changes.outputs.ractor }}" == "true" ]]; then
            run_mutant gems/ractor ractor
          fi

          if [[ "${{ needs.changes.outputs.rails }}" == "true" || "${{ needs.changes.outputs.rack }}" == "true" || "${{ needs.changes.outputs.rails_support }}" == "true" ]]; then
            run_mutant gems/rails rails
          fi

          if [[ "${{ needs.changes.outputs.rails_support }}" == "true" ]]; then
            run_mutant gems/rails_support rails_support
          fi

          if [[ "${{ needs.changes.outputs.redaction }}" == "true" ]]; then
            run_mutant gems/redaction redaction
          fi

          if [[ "${{ needs.changes.outputs.semantic_logger }}" == "true" ]]; then
            run_mutant gems/semantic_logger semantic_logger
          fi
